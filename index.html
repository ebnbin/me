<!doctype html>
<form id=f hidden>
  <input id=pw type=password placeholder="Password">
  <button>Save</button>
</form>
<script>
const W='https://me.ebnbin.workers.dev'
const p=localStorage.getItem('password')
if(p){
  window.WORKER_URL=W
  window.APP_PASSWORD=p
  fetch(`${W}/?password=${encodeURIComponent(p)}`).then(r=>{
    if(r.status===401){
      localStorage.removeItem('password')
      location.reload()
      return
    }
    return r.json().then(j=>{
      const src=j.results.find(b=>b.type==='code').code.rich_text.map(x=>x.plain_text).join('')
      new Function(src)()
    })
  })
}
else{
  f.hidden=false
  f.onsubmit=e=>{
    e.preventDefault()
    localStorage.setItem('password',pw.value)
    location.reload()
  }
}
</script>
