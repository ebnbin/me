<!doctype html>
<form id=f hidden>
  <input id=co type=password placeholder="Code">
  <button>Save</button>
</form>
<script>
const W='https://me.ebnbin.workers.dev'
const c=localStorage.getItem('code')
if(c){
  window.WORKER_URL=W
  window.APP_CODE=c
  fetch(`${W}/?code=${encodeURIComponent(c)}`).then(r=>{if(r.status===401){localStorage.removeItem('code');location.reload();return}return r.json().then(j=>new Function(j.results.find(b=>b.type==='code').code.rich_text.map(x=>x.plain_text).join(''))())})
}
else{f.hidden=false;f.onsubmit=e=>{e.preventDefault();localStorage.setItem('code',co.value);location.reload()}}
</script>
